services:
  app:
    image: family-dashboard:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: family-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      # 至少 32 位的随机字符串，可用 `openssl rand -hex 32` 生成
      - APP_SECRET=${APP_SECRET:?请在 .env 中设置 APP_SECRET}
      # 对外访问的 HTTPS 地址，例如 https://dash.example.synology.me
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TZ=Asia/Shanghai
