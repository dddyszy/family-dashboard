# 使用 GitHub Actions 预先构建好的镜像，NAS 上无需源码和构建环境。
services:
  app:
    # 国内拉取慢时，在 .env 中把 IMAGE 改为阿里云镜像地址
    image: ${IMAGE:-ghcr.io/dddyszy/family-dashboard:latest}
    container_name: family-dashboard
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./data:/app/data
    environment:
      # 至少 32 位的随机字符串，可用 `openssl rand -hex 32` 生成
      - APP_SECRET=${APP_SECRET:?请在 .env 中设置 APP_SECRET}
      # 对外访问的 HTTPS 地址，例如 https://dash.example.com
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TZ=Asia/Shanghai
