# 使用已发布镜像，服务器上无需源码和构建环境。
services:
  app:
    # 升级版本或切换镜像源时，直接修改此地址；镜像需已实际发布。
    image: ghcr.io/dddyszy/family-dashboard:v0.2.0
    container_name: family-dashboard
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./data:/app/data
    environment:
      # 必填：执行 openssl rand -hex 32，将输出粘贴到引号内；空值无法启动。
      APP_SECRET: ""
      # 按本文通过内网 IP + 端口访问时，保持为空。
      PUBLIC_URL: ""
      TZ: Asia/Shanghai
